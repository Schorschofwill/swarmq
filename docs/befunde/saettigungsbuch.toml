# Sättigungsbuch (Plan docs/plans/2026-10-24-1118-chore-qualitaetsablauf-plan.md, U5, KTD8, KTD10)
#
# Läufe und Signale der tiefen Runden. Methoden und Module stehen in
# docs/befunde/methodenkatalog.md, den Stand berechnet `uv run just saettigung`.
# Der Guard tests/unit/test_saettigungsbuch.py prüft das Schema.
#
# [[lauf]]: id (L-nnn), datum, commit (Stand des geprüften Codes), methode,
#   modul, umfang (Zahl, 0 = ohne nachgewiesenen Prüfumfang, zählt nicht),
#   einheit, befunde = [{ id, einstufung }] mit der ID aus einem Register unter
#   docs/befunde/ und der Einstufung FEHLER, LÜCKE, VERBESSERUNG, ENTSCHEIDUNG
#   oder NICHT HALTBAR. Nur FEHLER, LÜCKE und VERBESSERUNG zählen als Befund.
# [[signal]]: id (S-nnn), quelle, saeule, modul, fundstelle, beschreibung,
#   dringlichkeit (normal, dringend), status (offen; untersucht mit lauf = "L-nnn";
#   verworfen mit grund).
#
# Rückfüllung (2026-10-24): Aufgenommen sind nur Läufe der Runden 2 und 4, deren
# Prüfumfang die Register und Rechercheberichte zahlenmäßig belegen und deren
# Befunde sich der Methode und dem Modul zuordnen lassen. Die Fundstelle steht
# je Lauf als Kommentar. Nicht aufgenommen, weil der Prüfumfang fehlt: die
# Lese-Methoden der Runden 2 und 3 und „Betrieb über Zeit“ (nur Zahlen von
# Prüfpunkten bzw. Befunden). Nicht aufgenommen, weil die Zuordnung zu einem
# Modul fehlt: Zustandsmodelle, Störungsinjektion, Chaos-Baseline und die
# Betriebsabläufe 4 bis 6 der Runde 4, der Cron-Fuzz der Runde 4 sowie aus
# Runde 2 die Mutation von client, workflow_orchestration und backoff.

