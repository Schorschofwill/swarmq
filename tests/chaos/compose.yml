# Chaos-Stack: dedicated RabbitMQ + Valkey + Toxiproxy on randomised
# ports (set via COMPOSE_PROJECT_NAME). The fixture in conftest.py
# starts/stops this stack per test class.

services:
  rabbitmq:
    # Exakt gepinnt auf dasselbe Abbild wie Hauptstack, CI und Loadsuite
    # (PF-1, Plan 2026-10-19-1500, KTD7); bis 0.13 lief hier 3.13.7-alpine.
    image: rabbitmq:4.3.6-management
    healthcheck:
      # `ping` only proves the Erlang VM is up — it goes green BEFORE the
      # AMQP listener (5672) actually accepts connections. `compose --wait`
      # would then release while a connecting worker still hits
      # "Server connection unexpectedly closed / Read 0 bytes" and exits.
      # `check_port_connectivity` gates on the listener ports accepting.
      # Als Benutzer rabbitmq (gosu): Ein CLI-Aufruf als root vor dem
      # Serverstart legt /var/lib/rabbitmq/.erlang.cookie root-eigen an, und
      # der Server bricht mit "eacces" ab (wie `rabbitmq42` in
      # docker-compose.yml).
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 15s

  valkey:
    # Exakt wie in der Loadsuite (KTD7).
    image: valkey/valkey:8.1.10-alpine
    # AOF on so Pub/Sub-adjacent state survives restarts where
    # relevant chaos tests assert recovery semantics.
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  toxiproxy:
    # Gepinnt wie docker-compose.chaos.yml und CI; das Docker-Hub-Repo
    # shopify/toxiproxy ist veraltet.
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0"]
    ports:
      - "${TOXI_ADMIN_PORT:-8474}:8474"
      - "${RABBITMQ_PROXY_PORT:-5675}:5672"
      - "${VALKEY_PROXY_PORT:-6381}:6379"
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
