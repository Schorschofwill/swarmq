[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Whitelist statt Blacklist: nur src/ ins sdist (pyproject.toml, README,
# LICENSE nimmt Hatchling automatisch auf). Hält Doku, Tests, Website,
# CI-/Agenten-Infrastruktur und lokale Caches dauerhaft aus dem Paket —
# sdist ~150 KB statt 1,6 MB.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[project]
name = "swarmq"
version = "0.11.0"
description = "Async task manager for Python 3.14+ using RabbitMQ and Valkey"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Härtung R2 P2: lower bounds protect downstream consumers installing
# without our lockfile. msgpack>=1.0 pins the safe default-limit
# semantics decode_result relies on; aio-pika>=9 the robust-connection
# API; valkey>=6 the asyncio client surface; msgspec>=0.18 the
# Struct/JSON APIs; structlog>=24 contextvars/testing surfaces (<27:
# get_logger relies on stdlib.BoundLogger frame depth, KTD1/KTD2);
# croniter>=6.2: fold-Verhalten in der Rückstellungsnacht nur dafür
# belegt (KTD1); tzdata, weil schlanke Images kein /usr/share/zoneinfo
# mitbringen und Cron-Zeitzonen per zoneinfo aufgelöst werden.
dependencies = [
    "msgspec>=0.18",
    "msgpack>=1.0",
    "structlog>=24,<27",
    "aio-pika>=9",
    # Plain valkey (no [libvalkey] extra): libvalkey is a C accelerator
    # that ships no cp314 wheels (sdist-only on PyPI), so a hard extra
    # forces a compiler into every consumer image on Python 3.14.
    # valkey-py picks libvalkey up automatically when present — opt in
    # via the [fast] extra.
    "valkey>=6",
    "croniter>=6.2",
    "tzdata",
]

[project.optional-dependencies]
# orjson: faster JSON encode. libvalkey: C parser for valkey-py (auto-
# detected when installed); sdist-only on PyPI, needs a build toolchain.
fast = ["orjson", "libvalkey>=4"]
metrics = ["prometheus_client"]
# R5.3: file-watch hot-reload trigger. Rust-backed, ~1 MB wheel —
# kept optional so non-reload deployments skip the footprint.
reload = ["watchfiles>=0.21"]
# Optional dependency-injection for tasks. Core SwarmQ runs without it;
# only tasks using FromDishka require the extra. 1.10.1 is the first
# release verified to carry wrap_injection(manage_scope=...), from_context,
# and the registry-introspection surface the integration relies on.
dishka = ["dishka>=1.10.1"]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-cov",
    "mypy",
    "ruff",
    # E2E-Hardening Phase 2+ — toxiproxy REST + property-based + fuzz
    "httpx",
    "hypothesis",
    "pytest-rerunfailures",
    "freezegun",
    # U2.1 chaos: RSS-polling for the OOM-simulation test.
    "psutil",
    # mypy (CI prueft tests/support): Typen fuer psutil.
    "types-psutil",
    # E2E-Hardening Phase 3 U3.10 — mutation testing.
    "mutmut",
    # R5.1: tests/unit/test_metrics.py asserts the real registry shape,
    # not just the no-op fallback. Same package as the [metrics] extra.
    "prometheus_client",
    # Dishka DI integration tests exercise the with-installed path.
    "dishka>=1.10.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-llmstxt>=0.3",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.11",
]

[project.scripts]
swarmq = "swarmq.cli:console_main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
# Default-Ausschluss der opt-in-Suiten (E2E-Hardening U1.2). Chaos,
# Stress, Soak, Property, Fuzz, Mutation laufen nur explizit via
# `pytest -m chaos` o.ä. — der Dev-Loop bleibt schnell (Regel in AGENTS.md:
# jeder Unit-Test < 100 ms, keine feste Gesamtgrenze).
addopts = "-m 'not chaos and not stress and not soak and not property and not fuzz and not mutation'"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow-running tests",
    "chaos: chaos-engineering tests (docker + toxiproxy, opt-in, nightly)",
    "stress: high-parallelism stress tests (opt-in, nightly)",
    "soak: long-running soak tests (opt-in, weekly)",
    "property: hypothesis property-based tests (opt-in, nightly thorough)",
    "fuzz: byte/json fuzzing tests (opt-in, nightly)",
    "mutation: marker for mutmut configuration (not invoked directly)",
]

[tool.mypy]
# Projektweit strict seit Plan U12 (R7/AE4): keine Override-Blöcke mehr —
# jede verbleibende ``# type: ignore`` trägt einen Fehlercode
# (warn_unused_ignores meldet tote Suppressions).
strict = true
warn_unused_ignores = true
packages = ["swarmq"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["croniter.*", "msgpack.*"]  # liefern keine Typ-Stubs
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
src = ["src"]
# Plan U2: erstes blockierendes Lint-Gate (``lint-and-types``). 120 statt 88
# entspricht der gelebten Zeilenbreite des Bestands (längste Zeile 120).
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    # 0.2.0-Restrukturierung (Plan U2, KTD7): Funktionsgrößen-Rauchmelder.
    # Bestandsverstöße tragen ``# noqa`` mit Unit-Verweis (die Unit zerlegt
    # das Modul) oder ``Follow-Up 0.2.x`` (kein Unit-Scope).
    "PLR0915", # too many statements
    "C901",    # too complex
]

ignore = [
    "N818",   # Exception-Namen ohne -Error sind Public API (KTD16); Umbenennung nur über U14-Inventar
    "SIM105", # ``try/except: pass`` bleibt explizit — best-effort-Pfade der Pipeline sind kommentiert
    "RUF002", # deutsche Typografie („ “ – ’) in Docstrings ist gewollt
    "RUF003", # dito in Kommentaren
]

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Testfunktionen erzählen Szenarien; die Größen-Limits gelten für src/.
"tests/**" = [
    "PLR0915", "C901",
    "N806", "N802", "N817",  # Test-Namen und Fixture-Aliase folgen Szenario, nicht PEP 8
    "RUF043",                # pytest.raises(match=…) mit literalem Text ist hier gewollt
    "B905", "B017",          # zip()-Längen und generische raises sind in Tests bewusst
]
# worker/pipeline.py: Import-Block nach dem _LockEntry-Dataclass; U19 räumt auf.

# E2E-Hardening Phase 3 U3.10 — mutation testing.
# Runner scores mutants against the fast unit-test suite.
[tool.mutmut]
paths_to_mutate = "src/swarmq/"
backup = false
runner = "uv run --extra test pytest tests/unit -x --no-header -q"
tests_dir = "tests/unit"
