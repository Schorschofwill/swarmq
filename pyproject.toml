[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Whitelist statt Blacklist: nur src/ ins sdist (pyproject.toml, README,
# LICENSE nimmt Hatchling automatisch auf). Hält Doku, Tests, Website,
# CI-/Agenten-Infrastruktur und lokale Caches dauerhaft aus dem Paket —
# sdist ~150 KB statt 1,6 MB.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[project]
name = "swarmq"
version = "0.1.0"
description = "Async task manager for Python 3.14+ using RabbitMQ and Valkey"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Härtung R2 P2: lower bounds protect downstream consumers installing
# without our lockfile. msgpack>=1.0 pins the safe default-limit
# semantics decode_result relies on; aio-pika>=9 the robust-connection
# API; valkey>=6 the asyncio client surface; msgspec>=0.18 the
# Struct/JSON APIs; structlog>=24 contextvars/testing surfaces;
# croniter>=2 tz-aware get_next/get_prev.
dependencies = [
    "msgspec>=0.18",
    "msgpack>=1.0",
    "structlog>=24",
    "aio-pika>=9",
    "valkey[libvalkey]>=6",
    "croniter>=2",
]

[project.optional-dependencies]
fast = ["orjson"]
metrics = ["prometheus_client"]
# R5.3: file-watch hot-reload trigger. Rust-backed, ~1 MB wheel —
# kept optional so non-reload deployments skip the footprint.
reload = ["watchfiles>=0.21"]
# Optional dependency-injection for tasks. Core SwarmQ runs without it;
# only tasks using FromDishka require the extra. 1.10.1 is the first
# release verified to carry wrap_injection(manage_scope=...), from_context,
# and the registry-introspection surface the integration relies on.
dishka = ["dishka>=1.10.1"]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-cov",
    "mypy",
    "ruff",
    # E2E-Hardening Phase 2+ — toxiproxy REST + property-based + fuzz
    "httpx",
    "hypothesis",
    "pytest-rerunfailures",
    "freezegun",
    # U2.1 chaos: RSS-polling for the OOM-simulation test.
    "psutil",
    # E2E-Hardening Phase 3 U3.10 — mutation testing.
    "mutmut",
    # R5.1: tests/unit/test_metrics.py asserts the real registry shape,
    # not just the no-op fallback. Same package as the [metrics] extra.
    "prometheus_client",
    # Dishka DI integration tests exercise the with-installed path.
    "dishka>=1.10.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-llmstxt>=0.3",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.11",
]

[project.scripts]
swarmq = "swarmq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
# Default-Ausschluss der opt-in-Suiten (E2E-Hardening U1.2). Chaos,
# Stress, Soak, Property, Fuzz, Mutation laufen nur explizit via
# `pytest -m chaos` o.ä. — Dev-Loop bleibt <= 15s.
addopts = "-m 'not chaos and not stress and not soak and not property and not fuzz and not mutation'"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow-running tests",
    "chaos: chaos-engineering tests (docker + toxiproxy, opt-in, nightly)",
    "stress: high-parallelism stress tests (opt-in, nightly)",
    "soak: long-running soak tests (opt-in, weekly)",
    "property: hypothesis property-based tests (opt-in, nightly thorough)",
    "fuzz: byte/json fuzzing tests (opt-in, nightly)",
    "mutation: marker for mutmut configuration (not invoked directly)",
]

[tool.mypy]
# Phased strict rollout (U4.2). The modules listed in strict-override
# below are strict-clean and gate CI. Legacy modules still have
# accumulated type debt and are checked at non-strict level; each
# migrates to strict by clearing its override block.
strict = false
packages = ["swarmq"]
mypy_path = "src"
disallow_untyped_defs = false
check_untyped_defs = true

# Strict-clean modules — tightened per the U4.2 phased rollout.
[[tool.mypy.overrides]]
module = [
    "swarmq.progress",
    "swarmq.headers",
    "swarmq.exceptions",
    "swarmq.backoff",
    "swarmq.signals",
    "swarmq.workflow",
    "swarmq.workflow_orchestration",
]
strict = true

# Legacy modules — kept at non-strict until separate cleanup passes.
# Listing them explicitly keeps the debt visible.
[[tool.mypy.overrides]]
module = [
    "swarmq.client",
    "swarmq.worker",
    "swarmq.task",
    "swarmq.scheduler",
    "swarmq.cli",
    "swarmq.cli.*",
    "swarmq.app",
    "swarmq.config",
    "swarmq.limits",
    "swarmq.locking",
    "swarmq.cancellation",
    "swarmq.middleware",
    "swarmq.registry",
    "swarmq.serialization",
    "swarmq.logging",
    "swarmq.backend.valkey",
    "swarmq.broker.rabbitmq",
]
ignore_errors = true

# Third-party stubs missing — bypass rather than require the stub packages.
[[tool.mypy.overrides]]
module = ["croniter.*", "msgpack.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

# E2E-Hardening Phase 3 U3.10 — mutation testing.
# Runner scores mutants against the fast unit-test suite.
[tool.mutmut]
paths_to_mutate = "src/swarmq/"
backup = false
runner = "uv run --extra test pytest tests/unit -x --no-header -q"
tests_dir = "tests/unit"
