[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmq"
version = "0.1.0"
description = "Async task manager for Python 3.14+ using RabbitMQ and Valkey"
requires-python = ">=3.14"
dependencies = [
    "msgspec",
    "msgpack",
    "structlog",
    "aio-pika",
    "valkey[libvalkey]",
    "croniter",
]

[project.optional-dependencies]
fast = ["orjson"]
metrics = ["prometheus_client"]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-cov",
    "mypy",
    "ruff",
    # E2E-Hardening Phase 2+ — toxiproxy REST + property-based + fuzz
    "httpx",
    "hypothesis",
    "pytest-rerunfailures",
    "freezegun",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-llmstxt>=0.3",
    "pymdown-extensions>=10.11",
]

[project.scripts]
swarmq = "swarmq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
# Default-Ausschluss der opt-in-Suiten (E2E-Hardening U1.2). Chaos,
# Stress, Soak, Property, Fuzz, Mutation laufen nur explizit via
# `pytest -m chaos` o.ä. — Dev-Loop bleibt <= 15s.
addopts = "-m 'not chaos and not stress and not soak and not property and not fuzz and not mutation'"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow-running tests",
    "chaos: chaos-engineering tests (docker + toxiproxy, opt-in, nightly)",
    "stress: high-parallelism stress tests (opt-in, nightly)",
    "soak: long-running soak tests (opt-in, weekly)",
    "property: hypothesis property-based tests (opt-in, nightly thorough)",
    "fuzz: byte/json fuzzing tests (opt-in, nightly)",
    "mutation: marker for mutmut configuration (not invoked directly)",
]

[tool.mypy]
strict = true
packages = ["swarmq"]
mypy_path = "src"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
