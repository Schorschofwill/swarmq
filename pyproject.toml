[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Whitelist statt Blacklist: nur src/ ins sdist (pyproject.toml, README,
# LICENSE nimmt Hatchling automatisch auf). Hält Doku, Tests, Website,
# CI-/Agenten-Infrastruktur und lokale Caches dauerhaft aus dem Paket —
# sdist ~150 KB statt 1,6 MB.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[project]
name = "swarmq"
version = "0.12.1"
description = "Async task manager for Python 3.14+ using RabbitMQ and Valkey"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Härtung R2 P2: lower bounds protect downstream consumers installing
# without our lockfile. msgpack>=1.0 pins the safe default-limit
# semantics decode_result relies on; aio-pika>=9 the robust-connection
# API; valkey>=6 the asyncio client surface; msgspec>=0.18 the
# Struct/JSON APIs; structlog>=24 contextvars/testing surfaces (<27:
# get_logger relies on stdlib.BoundLogger frame depth, KTD1/KTD2);
# croniter>=6.2: fold-Verhalten in der Rückstellungsnacht nur dafür
# belegt (KTD1); tzdata, weil schlanke Images kein /usr/share/zoneinfo
# mitbringen und Cron-Zeitzonen per zoneinfo aufgelöst werden.
dependencies = [
    "msgspec>=0.18",
    "msgpack>=1.0",
    "structlog>=24,<27",
    "aio-pika>=9",
    # Plain valkey (no [libvalkey] extra): libvalkey is a C accelerator
    # that ships no cp314 wheels (sdist-only on PyPI), so a hard extra
    # forces a compiler into every consumer image on Python 3.14.
    # valkey-py picks libvalkey up automatically when present — opt in
    # via the [fast] extra.
    "valkey>=6",
    "croniter>=6.2",
    "tzdata",
]

[project.optional-dependencies]
# orjson: faster JSON encode. libvalkey: C parser for valkey-py (auto-
# detected when installed); sdist-only on PyPI, needs a build toolchain.
fast = ["orjson", "libvalkey>=4"]
metrics = ["prometheus_client"]
# R5.3: file-watch hot-reload trigger. Rust-backed, ~1 MB wheel —
# kept optional so non-reload deployments skip the footprint.
reload = ["watchfiles>=0.21"]
# Optional dependency-injection for tasks. Core SwarmQ runs without it;
# only tasks using FromDishka require the extra. 1.10.1 is the first
# release verified to carry wrap_injection(manage_scope=...), from_context,
# and the registry-introspection surface the integration relies on.
dishka = ["dishka>=1.10.1"]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    # Reihenfolge in jedem Lauf gemischt (Plan 2026-10-13-0902, KTD3). Im
    # Extra statt ``uv run --with``: dort zeigt sys.prefix auf ein Overlay.
    "pytest-randomly>=5.0",
    # Unit-Suite auf mehrere Prozesse verteilt (just unit, Plan Beschleunigung
    # Stufe 1); Integration und e2e folgen mit eigener vhost/DB je Prozess.
    "pytest-xdist>=3.8",
    # Gemessen wird mit ``coverage run -m pytest`` (KTD5), nicht pytest-cov:
    # dessen eigene Unterprozess-Messung ist seit 7.0 entfallen, und
    # ``[tool.coverage.run] patch`` deckt Eltern und Kinder einheitlich ab.
    # 7.16.2: Korrekturen der Zweig-Messung unter 3.14.
    "coverage>=7.16.2",
    # E2E-Hardening Phase 2+ — toxiproxy REST + property-based + fuzz
    "httpx",
    "hypothesis",
    "freezegun",
    # U2.1 chaos: RSS-polling for the OOM-simulation test.
    "psutil",
    # E2E-Hardening Phase 3 U3.10 — mutation testing.
    "mutmut",
    # R5.1: tests/unit/test_metrics.py asserts the real registry shape,
    # not just the no-op fallback. Same package as the [metrics] extra.
    "prometheus_client",
    # Dishka DI integration tests exercise the with-installed path.
    "dishka>=1.10.1",
    # Entscheidungsregister: Frontmatter der Pack-Regeln (tests/unit/test_entscheidungsregister.py).
    "pyyaml",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-llmstxt>=0.3",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.11",
]

# Entwicklungswerkzeuge als PEP-735-Gruppen (Plan 2026-10-11-1200, KTD9):
# werden nicht veröffentlicht. ``uv run``/``uv sync`` ziehen sie über
# ``default-groups`` mit — auch die Unit-Suite braucht ``typing``, weil
# tests/unit/typing/test_contract_shapes.py mypy als Subprozess startet.
[dependency-groups]
lint = [
    "ruff>=0.17",
    "prek>=0.5",
]
typing = [
    "mypy>=2.4",
    "basedpyright>=1.40",
    # Typen für psutil (tests/support, Chaos-Tests).
    "types-psutil",
    "types-PyYAML",
]

# just als Einstiegspunkt für lokal und CI (KTD9); ``uv run just …``.
tasks = [
    "rust-just>=1.58",
]
# Nur der Combine-Job der CI braucht diff-cover (KTD8).
coverage = [
    "diff-cover>=10.6",
]

[tool.uv]
default-groups = ["lint", "typing", "tasks"]

[project.scripts]
swarmq = "swarmq.cli:console_main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmq"]

[tool.pytest.ini_options]
# strict bündelt strict_config, strict_markers, strict_xfail und
# strict_parametrization_ids (Plan 2026-10-13-0902, KTD1). pytest ist über
# uv.lock gepinnt; künftige Strict-Optionen kommen nur mit einem Upgrade.
strict = true
asyncio_mode = "auto"
# Ausdrücklich gesetzt, bevor pytest-asyncio den Standard ändert. Es gibt
# keine asynchronen Session- oder Modul-Fixtures.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# Jede Warnung ist ein Fehler (KTD2), auch unraisable Warnungen aus __del__
# (PytestUnraisableExceptionWarning). Ausnahmen nur eng nach Kategorie und
# Modul oder Meldung, jeweils mit Grund.
filterwarnings = [
    "error",
]
testpaths = ["tests"]
timeout = 30
# Default-Ausschluss der opt-in-Suiten (E2E-Hardening U1.2). Chaos,
# Stress, Soak, Property, Fuzz, Mutation, Compat laufen nur explizit via
# `pytest -m chaos` o.ä. — der Dev-Loop bleibt schnell (Regel in AGENTS.md:
# jeder Unit-Test < 100 ms, keine feste Gesamtgrenze).
addopts = "-m 'not chaos and not stress and not soak and not property and not fuzz and not mutation and not compat'"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow-running tests",
    "chaos: chaos-engineering tests (docker + toxiproxy, opt-in, nightly)",
    "stress: high-parallelism stress tests (opt-in, nightly)",
    "soak: long-running soak tests (opt-in, weekly)",
    "property: hypothesis property-based tests (opt-in, nightly thorough)",
    "fuzz: byte/json fuzzing tests (opt-in, nightly)",
    "mutation: marker for mutmut configuration (not invoked directly)",
    "entscheidung(id): schreibt eine Entscheidung aus compound-packs/swarmq-entscheidungen/ fest (ID E-nnn)",
    "befund(id): Nachweis eines offenen Befunds aus docs/befunde/ (immer mit xfail strict=True)",
    "compat: Mischbetrieb mit swarmq 0.11.x und 0.12.0 aus PyPI (tests/compat, opt-in, braucht Netz zu PyPI)",
    "spike: Charakterisierung des Broker-Verhaltens (tests/integration/spikes, RabbitMQ 4.3 und 4.2)",
]

[tool.coverage.run]
# Plan 2026-10-13-0902, KTD5/KTD6: gemessen mit ``coverage run -m pytest``.
# ``patch`` deckt alle Prozessmodelle ab: Supervisor-Kinder (spawn), CPU-Pool
# (forkserver), rohe Forks in logging_fork/logging_file, ``os._exit`` und den
# Reload per ``execvpe``. Mit SIGKILL beendete Kinder schreiben keine Daten.
# Keine dynamischen Kontexte: Sie erzwingen den langsamen ctrace-Kern.
# Ohne ``concurrency = multiprocessing``: ``patch = subprocess`` misst
# spawn-Kinder schon ab Interpreterstart; die zweite, spaetere Messung meldete
# ``module-not-measured`` auf stderr und brach JSON-Logausgaben von Workern.
# Ohne ``sigterm``: swarmq setzt eigene SIGTERM-Handler, und die Exit-Pfade
# (``os._exit``, ``execv``) sind gepatcht.
branch = true
parallel = true
relative_files = true
source = ["swarmq"]
patch = ["subprocess", "_exit", "execv", "fork"]
concurrency = ["thread"]

[tool.coverage.paths]
# Absicherung, falls Kinddaten mit installiertem statt Quellpfad entstehen.
source = ["src/swarmq", "*/site-packages/swarmq"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 96

[tool.mypy]
# Projektweit strict seit Plan U12 (R7/AE4): keine Override-Blöcke mehr —
# jede verbleibende ``# type: ignore`` trägt einen Fehlercode
# (warn_unused_ignores meldet tote Suppressions).
strict = true
warn_unused_ignores = true
# Plan 2026-10-11-1200 (KTD6): Zusatzcodes jenseits von --strict, das Set
# von Litestar plus die für async-Code wichtigen (unused-awaitable).
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "redundant-self",
    "possibly-undefined",
    "unused-awaitable",
    "deprecated",
    "exhaustive-match",
    "mutable-override",
    "explicit-override",
]
packages = ["swarmq"]
# typings/: schmale Stubs für msgpack und croniter, gelesen von mypy und
# basedpyright (stubPath) gleichermaßen (Plan 2026-10-11-1200, KTD8).
mypy_path = "src:typings"

[[tool.mypy.overrides]]
# Plan 2026-10-11-1200 (KTD7): Tests ohne Annotationspflicht, aber mit
# geprüften Rümpfen (check_untyped_defs bleibt aus --strict an).
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false


# Zweiter Typprüfer (Plan 2026-10-11-1200, KTD8): basedpyright strict, nur
# src/, ohne Baseline. Jeder Prüfer beachtet nur seine eigenen Kommentare:
# mypy ``# type: ignore[code]``, basedpyright ``# pyright: ignore[rule]``.
[tool.basedpyright]
include = ["src/swarmq"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Paketinterner Zugriff über Fassaden ist Architektur (wie ruff SLF001).
reportPrivateUsage = false
# Private ``_``-Funktionen werden über Fassaden und Nachbarmodule importiert
# (auch für mock.patch); dieselbe Begründung wie reportPrivateUsage.
reportUnusedFunction = false
# valkey-py liefert unvollständige Typen (``**kwargs``, ``dict`` ohne
# Typargumente); die Aufrufe der Client-Methoden stehen gebündelt im Backend.
executionEnvironments = [
    { root = "src/swarmq/backend/valkey", reportUnknownMemberType = false },
    { root = "src" },
]

[tool.ruff]
target-version = "py314"
src = ["src"]
# Plan U2: erstes blockierendes Lint-Gate (``lint-and-types``). 120 statt 88
# entspricht der gelebten Zeilenbreite des Bestands (längste Zeile 120).
line-length = 120
# Nur Python (Plan 2026-10-11-1200, U2): ruff 0.17 formatiert sonst auch
# Codeblöcke in Markdown — darunter abgeschlossene Pläne, die unverändert
# bleiben sollen.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# Plan 2026-10-11-1200 (KTD1): alle Regeln, Ausnahmen nur mit Begründung.
# Neue Regeln eines ruff-Upgrades greifen automatisch. Ausnahmen an einer
# einzelnen Stelle tragen ``# noqa: <CODE>`` mit kurzem Grund (KTD2).
select = ["ALL"]

ignore = [
    # --- Werkzeug-Konflikt ---------------------------------------------
    "COM812",  # kollidiert mit ruff format
    "ISC001",  # kollidiert mit ruff format
    "E501",    # Zeilenlänge regelt der Formatter; Rest sind lange Strings
    "CPY",     # keine Lizenzköpfe je Datei (LICENSE im Repo)
    "ANN",     # Annotationen erzwingt mypy strict
    "D",       # Docstring-Policy ist ein eigenes Thema (Plan: Scope Boundaries)
    # --- Projektentscheidung oder API-Vertrag ----------------------------
    "ASYNC109",          # öffentliche ``timeout``-Parameter (KTD16, Plan 0.2.0)
    "FBT001", "FBT002",  # boolesche Positionsparameter sind öffentliche Signaturen
    "PLR0913", "PLR0917",  # Parameterzahl öffentlicher Signaturen
    "PLR0911", "PLR0912",  # Größenmelder sind PLR0915 und C901 (KTD7, Plan 0.2.0)
    "PLC0415",  # lazy Importe, erzwungen von tests/unit/test_cli_import_laziness.py
    "PLC0414",  # ``import x as x`` ist der explizite Re-Export für no_implicit_reexport
    "SLF001",   # paketinterner Zugriff über Fassaden ist Architektur (test_architecture_guards)
    "TC001", "TC002", "TC003",  # msgspec und dishka werten Annotationen zur Laufzeit aus
    "N818",     # Exception-Namen ohne -Error sind Public API (KTD16)
    "SIM105",   # ``try/except: pass`` bleibt explizit — Best-Effort-Pfade sind kommentiert
    "RUF002",   # deutsche Typografie („ “ – ’) in Docstrings ist gewollt
    "RUF003",   # dito in Kommentaren
    # --- Stil ohne Nutzen für dieses Projekt ------------------------------
    "TRY003", "EM101", "EM102",  # Fehlermeldungen direkt am raise sind gewollt
    "TRY400",  # Log-Ausgabe ist durch die Logging-Pläne festgelegt; exception() änderte sie
    "S101",    # alle ``assert`` in src/ sind Typ-Narrowing ohne Seiteneffekt (Analyse 2026-10-11)
]

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Größen-Limits gelten für src/; Testfunktionen erzählen Szenarien.
    "PLR0915", "C901",
    "N806", "N802", "N817",  # Test-Namen und Fixture-Aliase folgen Szenario, nicht PEP 8
    "RUF043",                # pytest.raises(match=…) mit literalem Text ist hier gewollt
    "B905", "B017",          # zip()-Längen und generische raises sind in Tests bewusst
    "S",        # Asserts, Subprozesse, Temp-Pfade und Test-Passwörter sind Testmittel
    "PLR2004",  # erwartete Werte stehen im Test als Literal
    "ARG",      # Fixture-Parameter und Fake-Signaturen
    "FBT",      # boolesche Argumente an Fakes und Fixtures
    "TRY", "EM",  # Fake-Exceptions mit Text
    "BLE",      # Fakes fangen bewusst breit
    "T201",     # Ausgaben in Hilfsprozessen der Tests
]

# E2E-Hardening Phase 3 U3.10 — mutation testing.
# Runner scores mutants against the fast unit-test suite.
[tool.mutmut]
# mutmut 3: Kernmodule (Zustellung, Gates, Retry, Scheduler, Schedules, Workflows).
source_paths = [
    "src/swarmq/backoff.py",
    "src/swarmq/keyspace.py",
    "src/swarmq/locking.py",
    "src/swarmq/worker/",
    "src/swarmq/broker/rabbitmq/delivery.py",
    "src/swarmq/broker/rabbitmq/publish_phase.py",
    "src/swarmq/scheduler/",
    "src/swarmq/backend/valkey/schedules.py",
    "src/swarmq/backend/valkey/results.py",
    "src/swarmq/client/schedule.py",
    "src/swarmq/workflow_orchestration.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
# Abgewählt: Architektur-/Typ-Tests prüfen den (mutierten) Quelltext; zwei Tests erkennen Tasks am Coroutine-Namen.
pytest_add_cli_args = ["-p", "no:randomly", "-q", "--no-header", "--ignore", "tests/unit/test_architecture_guards.py", "--ignore", "tests/unit/typing", "--ignore", "tests/unit/test_benchmark_guard.py", "--deselect", "tests/unit/worker/test_lifecycle.py::TestStartupAbortLeavesNoScheduler", "--ignore", "tests/unit/test_logging_architecture.py", "--deselect", "tests/unit/scheduler/test_loop_candidate.py::test_second_start_does_not_start_a_second_report_loop"]
also_copy = ["tests", "typings", "src/swarmq", "website", "docs", "scripts", "benchmarks", "overrides", "README.md", "AGENTS.md", "mkdocs.yml", "docker-compose.yml", "docker-compose.chaos.yml", "docker-compose.swarmq-dev.yml", "uv.lock"]
# Kein Fork aus dem Hauptprozess: die Testsuite hinterlässt Modulzustand.
process_isolation = "forkserver"
forkserver_warmup = "none"
