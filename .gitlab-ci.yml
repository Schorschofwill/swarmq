# CI pipeline.
#
#   test stage — the regression gate:
#     * unit-tests / integration-tests: deterministic, BLOCKING.
#     * e2e-tests: runs the full e2e suite, BLOCKING, no reruns. The
#       environment-sensitive cron/leader flakiness was root-caused to two
#       confirmed mechanisms, both now fixed: (1) cron-sync clobber — tests
#       injected manual due-fires that raced the scheduler's initial
#       sync_taskinfo_crons (which add_schedule()s the next cron-minute score);
#       fixed by making the injection the last writer (wait for the scheduler's
#       write first); (2) orphaned scheduler tasks on cancel — Worker.start()
#       skipped teardown on the cancel path, leaking the election/poll loops
#       (zombie leader); fixed by a cancel-safe try/finally + Scheduler.abort().
#       Verified: the full suite ran clean 3x under 6-way CPU saturation
#       (heavier than the CI runner). A red e2e job is now a real regression.
#     * fuzz: im Unit-Job, blockierend, deterministisch (Profil ci) und mit
#       Wächter gegen leere Läufe (Plan 2026-10-24-1118).
#     * chaos: nicht in der Pipeline -- örtlich vor Releases, siehe den
#       Block weiter unten und docs/testing/test-strategy.md.
#   secret_detection runs in the test stage, next to the tests (it needs
#     nothing from them), so it does not extend the critical path.
#
# All Python steps run through uv against the committed uv.lock (UV_FROZEN),
# on the project's pinned Python 3.14. Notes:
#   * No compiler and no apt-get: every installed package ships a cp314 or
#     abi3 wheel (libvalkey sits in the `fast` extra, which CI does not
#     install). Jobs that need git (unit: ratchet test; coverage-combine:
#     fetch main) use the non-slim uv image, which ships it; all others use
#     the slim image (Plan Beschleunigung, Stufe 1).
#   * The uv cache is the runner volume `swarmq-uv-cache` at /uv-cache (local
#     runner, config.toml), not a GitLab cache archive: packing and unpacking
#     the archive cost ~14 s per job. On a runner without that volume uv just
#     downloads into an empty /uv-cache.
#   * The `reload` extra (watchfiles) is needed by the hot-reload tests; it
#     ships abi3 wheels so it installs without a Rust toolchain. `fast`
#     (orjson) is intentionally NOT installed — it has no cp314/abi3 wheel and
#     would require Rust; no test hard-depends on it.
# Run exactly one pipeline per push: a branch (or tag) pipeline. Merge-request
# pipelines are suppressed because the test jobs carry no MR `rules` and would
# be skipped there — which is what produced the confusing "skipped" MR pipeline
# alongside the real branch pipeline. The MR shows the branch pipeline's status.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - coverage

variables:
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: "/uv-cache"
  # The cache volume and the job's venv are different filesystems.
  UV_LINK_MODE: "copy"
  UV_FROZEN: "1"
  # Canonical uv invocation: test deps + the reload extra the hot-reload
  # tests need. Keep every test job using this so the resolved env matches.
  # `uv run` also installs the default dependency groups `lint` and `typing`
  # ([tool.uv] default-groups): ruff, mypy, basedpyright, prek. The unit job
  # needs `typing` too -- tests/unit/typing/test_contract_shapes.py runs mypy.
  UV_RUN: "uv run --extra test --extra reload"
  # Ein Seed je Pipeline fuer pytest-randomly (Plan 2026-10-13-0902, U8):
  # ein roter Job laesst sich lokal mit SWARMQ_TEST_SEED=<Pipeline-ID>
  # uv run just <rezept> nachstellen. scripts/run-tests.sh gibt ihn aus.
  SWARMQ_TEST_SEED: "$CI_PIPELINE_ID"

# Shared uv setup: pinned-Python slim image, no setup steps (see header).
# Exakt gepinnt: uv 0.11.6 (uv audit, Job abhaengigkeiten-pruefen) und Python
# 3.14.4 wie .python-version, denn die Modulzahlen der Kostensuite hängen an der
# Python-Version (Plan 2026-10-24-1118, KTD2, KTD5). Der gleitende Tag
# python3.14-bookworm-slim steht seit Februar 2026 auf uv 0.9.30 und Python
# 3.14.2; Astral pflegt nur noch Trixie. Python-Update = neuer Tag hier, in
# .python-version und docker/mutation/Dockerfile, plus neu erhobene Basislinie.
.uv:
  image: ghcr.io/astral-sh/uv:0.11.6-python3.14-trixie-slim
  before_script: []

# Same, with git (non-slim image): the ratchet test and coverage-combine.
.uv-git:
  extends: .uv
  image: ghcr.io/astral-sh/uv:0.11.6-python3.14-trixie

# Real RabbitMQ + Valkey services + a readiness gate. Reused by the
# integration and e2e jobs. RabbitMQ is pinned exactly (Plan 2026-10-08-1541,
# KTD9): consumer-timeout behaviour differs between 4.2 and 4.3. Explicit
# aliases, because the integration job adds a second rabbitmq image and both
# would otherwise get the automatic alias `rabbitmq`.
.with-services:
  extends: .uv
  services:
    - name: rabbitmq:4.3.6-management
      alias: rabbitmq
    - name: valkey/valkey:8
      alias: valkey
  variables:
    SWARMQ_TEST_RABBITMQ_HOST: rabbitmq
    SWARMQ_TEST_RABBITMQ_PORT: "5672"
    SWARMQ_TEST_VALKEY_HOST: valkey
    SWARMQ_TEST_VALKEY_PORT: "6379"
    # Management API: each xdist worker creates its own vhost through it
    # (tests/support/services.py), so the gate waits for it as well.
    SWARMQ_TEST_RABBITMQ_MGMT_PORT: "15672"
    # host:port pairs the readiness gate waits for (space separated).
    SWARMQ_CI_WAIT_FOR: "rabbitmq:5672 rabbitmq:15672 valkey:6379"
  before_script:
    # Block until both services accept connections. check_docker SKIPS (not
    # fails) when a service is unreachable, so without this gate a slow broker
    # start would let the whole suite go green with zero tests run. This also
    # warms the uv venv (build + extras) once before the test step.
    - |
      $UV_RUN python - <<'PY'
      import os, socket, sys, time
      targets = [(h, int(p)) for h, p in (t.rsplit(":", 1) for t in os.environ["SWARMQ_CI_WAIT_FOR"].split())]
      deadline = time.time() + 120
      for host, port in targets:
          while True:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      break
              except OSError:
                  if time.time() > deadline:
                      sys.exit(f"service {host}:{port} not ready in time")
                  time.sleep(1)
      print("all services ready")
      PY

# Lint + Typen: Format, ruff mit allen Regeln (Ausnahmen begründet in
# pyproject.toml), mypy strict über src und tests, basedpyright strict über
# src (Plan 2026-10-11-1200). Dieselben Befehle laufen lokal als prek-Hooks.
# Kein Build-Toolchain nötig (die Prüfer brauchen die C-Extension nicht);
# $UV_RUN, damit mypy das `reload`-Extra (watchfiles) auflösen kann. Die
# Werkzeuge kommen aus den Gruppen `lint`/`typing` (KTD9).
# stubtest gleicht die lokalen Teil-Stubs in typings/ (msgpack, croniter) mit
# den installierten Paketen ab, damit Drift nach Upgrades auffällt.
# --ignore-missing-stub: die Stubs decken bewusst nur die von swarmq genutzte
# Oberfläche ab; geprüft wird, dass das Gestubbte zur Laufzeit passt.
lint-and-types:
  extends: .uv
  stage: test
  before_script: []
  script:
    # Die Befehle stehen im justfile (lint, types) und laufen lokal gleich.
    - $UV_RUN just lint
    - $UV_RUN just types

# Tier 1 — unit + property. No external services; the fast regression gate.
# Guards against uv.lock drifting from pyproject.toml — including optional
# extras that no other job installs. UV_FROZEN cannot catch that drift: it only
# fails an install that re-resolves against the missing piece, and an
# un-installed extra is never resolved. Must override UV_FROZEN to 0 here —
# under UV_FROZEN=1, `uv lock --check` validates only lock *validity*, not
# up-to-dateness (it warns and exits 0 even with drift). No build toolchain
# needed, so before_script is emptied. See
# docs/solutions/tooling-decisions/uv-lock-drift-from-pyproject-optional-extras.md
lock-check:
  extends: .uv
  stage: test
  variables:
    UV_FROZEN: "0"
  before_script: []
  script:
    - uv lock --check

# Bekannte Schwachstellen in den Abhängigkeiten aus uv.lock, per uv audit
# gegen OSV (Plan 2026-10-24-1118, KTD2). Blockierend nur, wenn der Branch
# uv.lock oder pyproject.toml gegenüber main ändert: Es gibt nur
# Branch-Pipelines, und ohne compare_to vergliche `changes` mit dem vorigen
# Push. Sonst nur eine Warnung, damit eine neue CVE main nie ohne eigenes
# Zutun rot macht; sie ist das Signal für die nächste Runde (R15). needs:
# lock-check, damit nie ein veraltetes Lock geprüft wird. Ausnahmen stehen im
# Rezept audit.
abhaengigkeiten-pruefen:
  extends: .uv
  stage: test
  needs: [lock-check]
  rules:
    - changes:
        paths: [uv.lock, pyproject.toml]
        compare_to: refs/heads/main
    - allow_failure: true
  script:
    - $UV_RUN just audit

# Rohdaten der Messung und JUnit-Berichte eines Test-Jobs, auch bei Rot.
.coverage-data:
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - .coverage.*
    reports:
      junit: junit-*.xml

# No reruns: the order is shuffled on every run (pytest-randomly, seed in the
# job log), and a failure is a bug to fix, not to retry (Plan 2026-10-13-0902,
# U4). Reproduce locally with --randomly-seed=<seed from the log>.
# Härtung R2 B1: the pure parser-fuzz suite joins the blocking gate — it is
# service-free; previously NO CI job ever executed tests/fuzz, so the suite
# was rotting unnoticed.
# Plan 2026-10-24-1118: SWARMQ_FUZZ_PROFILE=ci lädt das Hypothesis-Profil
# mit derandomize (gleiche Beispiele in jedem Lauf, R10). SWARMQ_TEST_MIN_TESTS
# macht den Lauf rot, wenn weniger Fuzz-Ziele ausgeführt als verlangt wurden,
# etwa weil alle übersprungen sind (AE7, scripts/run-tests.sh). Die Zahl ist
# die aktuelle Zahl der Ziele ohne Dienste.
unit-tests:
  extends: .uv-git
  stage: test
  variables:
    SWARMQ_TEST_COVERAGE: "1"
  script:
    - $UV_RUN just unit -q --junitxml=junit-unit.xml
    - $UV_RUN just property -q --junitxml=junit-property.xml
    - SWARMQ_FUZZ_PROFILE=ci SWARMQ_TEST_MIN_TESTS=31 $UV_RUN just fuzz -q --junitxml=junit-fuzz.xml
    # Ohne Coverage: Sie lädt eigene Module in jedes Kind, die Modulzahlen
    # liefen sonst zwischen CI und lokal auseinander (Plan 2026-10-24-1118, KTD4).
    - SWARMQ_TEST_COVERAGE= $UV_RUN just kosten -q --junitxml=junit-kosten.xml
  artifacts: !reference [.coverage-data, artifacts]

# Tier 2a — integration against real RabbitMQ + Valkey (deterministic).
# Second broker 4.2.9 only here, for tests/integration/broker/
# test_consumer_timeout.py. Its RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS is a
# service-level variable: job variables reach every service container, and
# the tick interval must not leak into the main broker. Both brokers need the
# management API (port 15672) for the consumer-timeout policy, so the gate
# waits for it too.
integration-tests:
  extends: .with-services
  stage: test
  services:
    - name: rabbitmq:4.3.6-management
      alias: rabbitmq
    - name: rabbitmq:4.2.9-management
      alias: rabbitmq42
      variables:
        RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit channel_tick_interval 1000"
    - name: valkey/valkey:8
      alias: valkey
  variables:
    SWARMQ_TEST_RABBITMQ42_HOST: rabbitmq42
    SWARMQ_TEST_RABBITMQ42_PORT: "5672"
    SWARMQ_TEST_RABBITMQ42_MGMT_PORT: "15672"
    SWARMQ_CI_WAIT_FOR: "rabbitmq:5672 rabbitmq:15672 rabbitmq42:5672 rabbitmq42:15672 valkey:6379"
    SWARMQ_TEST_COVERAGE: "1"
  script:
    - $UV_RUN just integration -q --junitxml=junit-integration.xml
    # Valkey-Befehle und Roundtrips je Task exakt gegen tests/kosten/basislinie.toml
    # (Plan 2026-10-24-1118, KTD6), ohne Coverage wie just kosten.
    - SWARMQ_TEST_COVERAGE= $UV_RUN just kosten-valkey -q --junitxml=junit-kosten-valkey.xml
  artifacts: !reference [.coverage-data, artifacts]

# Tier 2b — full e2e. BLOCKING, no reruns. The two confirmed flakiness causes
# (cron-sync clobber; orphaned scheduler tasks on cancel) are fixed and the
# full suite ran clean 3x under 6-way CPU saturation, so the gate is honest.
e2e-tests:
  extends: .with-services
  stage: test
  variables:
    SWARMQ_TEST_COVERAGE: "1"
  script:
    - $UV_RUN just e2e -q --junitxml=junit-e2e.xml
  artifacts: !reference [.coverage-data, artifacts]

# Coverage (Plan 2026-10-13-0902, U8, KTD5-KTD8, KTD11): Die drei Test-Jobs
# messen unter ``coverage run`` (SWARMQ_TEST_COVERAGE) und laden Rohdaten und
# JUnit auch bei Rot hoch. Der Combine-Job laeuft nur, wenn alle drei gruen
# sind (ein Teilbericht waere irrefuehrend), fuehrt zusammen, schreibt
# coverage.xml fuer die MR-Anzeige und prueft das Gate:
#   * ``coverage report`` scheitert unter ``fail_under`` (Untergrenze).
#   * scripts/coverage_gate.py holt main ausdruecklich (Branch-Pipelines
#     laden nur ihren Ref) und vergleicht gegen den Merge-Base: fail_under
#     darf nicht sinken, neue Zeilen muessen 100 % abgedeckt sein. Auf main
#     und Tags entfaellt der Vergleich.
coverage-combine:
  extends: .uv-git
  stage: coverage
  needs: [unit-tests, integration-tests, e2e-tests]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - $UV_RUN just coverage-report
    - $UV_RUN just coverage-gate
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Tier 2c — stress against real services. Härtung R2 B1: previously never
# executed by any CI job. Scheduled (nightly) + manual; honest gate on the
# scheduled run (no allow_failure) so a stress regression actually notifies.
stress-tests:
  extends: .with-services
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  script:
    - $UV_RUN just stress -q

# Tier 3b — soak (1h sustained load). Deliberately manual-only: too long for
# every schedule; run before releases. Documented here so the exclusion is
# explicit, not silent (Härtung R2 B1).
soak-tests:
  extends: .with-services
  stage: test
  rules:
    - when: manual
      allow_failure: true
  allow_failure: true
  script:
    - $UV_RUN pytest tests/soak -m soak -q

# Kein Chaos-Job mehr in dieser Pipeline, und das ist eine bewusste
# Abweichung von KTD15 (Plan U2), kein Versehen.
#
# Der Job trug `allow_failure: false` und hielt Branch-Pipelines blockiert,
# bis er gruen war. Gelaufen ist er zweimal, 2026-09-15 und 2026-09-22, und
# beide Male meldete er Erfolg, ohne etwas geprueft zu haben: "1 passed,
# 40 skipped" in 1,17 s. `docker:dind` braucht einen privilegierten
# Container, der Runner dieses Projekts faehrt mit `privileged = false`,
# und die Fixture uebersprang dann jeden Test.
#
# Drei Wege standen zur Wahl. Den Runner zu oeffnen haette jedem Job dort
# die Kontrolle ueber den Rechner gegeben -- fuer ein Gate, das manuell und
# selten faehrt. Die SaaS-Runner koennen dind, weisen den Job aber mit
# `ci_quota_exceeded` ab: der Free-Plan hat keine Minuten mehr. Bleibt der
# dritte: die Suite laeuft oertlich vor Releases, und niemand behauptet in
# der Pipeline etwas anderes.
#
# Wie und wann: docs/testing/test-strategy.md, Abschnitt "Chaos und Chaos-gestützter Fuzz".

secret_detection:
  stage: test
  needs: []

include:
- template: Security/Secret-Detection.gitlab-ci.yml
