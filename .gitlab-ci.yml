# CI pipeline.
#
#   test stage — the regression gate:
#     * unit-tests / integration-tests: deterministic, BLOCKING.
#     * e2e-tests: runs the full e2e suite, BLOCKING, no reruns. The former
#       "environment-sensitive flakiness" was a single root cause: a worker
#       from a prior e2e file left the scheduler leader lock held (default 30s
#       TTL) because cancel-based teardown skips the graceful release, starving
#       the next scheduler test's leader election. Fixed by flushing Valkey on
#       scheduler/signal test setup (not just teardown). Liveness waits were
#       also widened off their tight 6s ceilings as defense-in-depth.
#     * chaos-tests: opt-in (schedule/manual), never blocks.
#   secret-detection stage — GitLab Secret Detection (unchanged).
#
# All Python steps run through uv against the committed uv.lock (UV_FROZEN),
# on the project's pinned Python 3.14. Notes:
#   * valkey[libvalkey] is a C extension with no cp314 wheel yet → compiled
#     from source, so every uv job installs build-essential first (the slim uv
#     image ships no compiler).
#   * The `reload` extra (watchfiles) is needed by the hot-reload tests; it
#     ships abi3 wheels so it installs without a Rust toolchain. `fast`
#     (orjson) is intentionally NOT installed — it has no cp314/abi3 wheel and
#     would require Rust; no test hard-depends on it.
# Run exactly one pipeline per push: a branch (or tag) pipeline. Merge-request
# pipelines are suppressed because the test jobs carry no MR `rules` and would
# be skipped there — which is what produced the confusing "skipped" MR pipeline
# alongside the real branch pipeline. The MR shows the branch pipeline's status.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_FROZEN: "1"
  # Canonical uv invocation: test deps + the reload extra the hot-reload
  # tests need. Keep every test job using this so the resolved env matches.
  UV_RUN: "uv run --extra test --extra reload"

# Shared uv setup: pinned-Python image, build toolchain for the libvalkey C
# extension, and a lockfile-keyed dependency cache.
.uv:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential

# Real RabbitMQ + Valkey services + a readiness gate. Reused by the
# integration and e2e jobs. (rabbitmq gets the alias `rabbitmq` automatically
# from its image name; only valkey/valkey:8 needs an explicit `valkey` alias.)
.with-services:
  extends: .uv
  services:
    - name: rabbitmq:4-management
    - name: valkey/valkey:8
      alias: valkey
  variables:
    SWARMQ_TEST_RABBITMQ_HOST: rabbitmq
    SWARMQ_TEST_RABBITMQ_PORT: "5672"
    SWARMQ_TEST_VALKEY_HOST: valkey
    SWARMQ_TEST_VALKEY_PORT: "6379"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential
    # Block until both services accept connections. check_docker SKIPS (not
    # fails) when a service is unreachable, so without this gate a slow broker
    # start would let the whole suite go green with zero tests run. This also
    # warms the uv venv (build + extras) once before the test step.
    - |
      $UV_RUN python - <<'PY'
      import socket, sys, time
      targets = [("rabbitmq", 5672), ("valkey", 6379)]
      deadline = time.time() + 120
      for host, port in targets:
          while True:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      break
              except OSError:
                  if time.time() > deadline:
                      sys.exit(f"service {host}:{port} not ready in time")
                  time.sleep(1)
      print("all services ready")
      PY

# Tier 1 — unit + property. No external services; the fast regression gate.
# --reruns 1 absorbs the rare timing flake on the small shared runner without
# hiding deterministic failures (a real break fails both attempts).
unit-tests:
  extends: .uv
  stage: test
  script:
    - $UV_RUN pytest tests/unit -q --reruns 1 --reruns-delay 1
    - $UV_RUN pytest tests/property -m property -q

# Tier 2a — integration against real RabbitMQ + Valkey (deterministic).
integration-tests:
  extends: .with-services
  stage: test
  script:
    - $UV_RUN pytest tests/integration -q

# Tier 2b — full e2e. BLOCKING, no reruns: the scheduler-leader-lock leak that
# caused the old flakiness is fixed (Valkey flush on scheduler/signal setup),
# so the gate is honest — a red e2e job is a real regression, not noise.
e2e-tests:
  extends: .with-services
  stage: test
  script:
    - $UV_RUN pytest tests/e2e -q

# Tier 3 — chaos (Toxiproxy + docker compose). Opt-in only: runs on scheduled
# pipelines or manual trigger, never blocks an MR. Needs a Docker-in-Docker
# capable runner; left allow_failure until validated on the target runner.
chaos-tests:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_FROZEN: "1"
    UV_RUN: "uv run --extra test --extra reload"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  allow_failure: true
  before_script:
    # build-essential: libvalkey C extension (the `reload` extra).
    # docker CLI + compose v2 plugin: NOT in Debian's repos
    # (`docker-compose-v2` does not exist there) — pull them from Docker's
    # official apt repo so `docker compose` is the v2 subcommand the chaos
    # fixture shells out to.
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential ca-certificates curl
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update
    - apt-get install -y --no-install-recommends docker-ce-cli docker-compose-plugin
    - docker compose version
  script:
    - $UV_RUN pytest -m chaos tests/chaos/test_workflow_chord_idempotency.py -q

secret_detection:
  stage: secret-detection

include:
- template: Security/Secret-Detection.gitlab-ci.yml
