# CI pipeline.
#
#   test stage — the regression gate:
#     * unit-tests / integration-tests: deterministic, BLOCKING.
#     * e2e-tests: runs the full e2e suite, BLOCKING, no reruns. The
#       environment-sensitive cron/leader flakiness was root-caused to two
#       confirmed mechanisms, both now fixed: (1) cron-sync clobber — tests
#       injected manual due-fires that raced the scheduler's initial
#       sync_taskinfo_crons (which add_schedule()s the next cron-minute score);
#       fixed by making the injection the last writer (wait for the scheduler's
#       write first); (2) orphaned scheduler tasks on cancel — Worker.start()
#       skipped teardown on the cancel path, leaking the election/poll loops
#       (zombie leader); fixed by a cancel-safe try/finally + Scheduler.abort().
#       Verified: the full suite ran clean 3x under 6-way CPU saturation
#       (heavier than the CI runner). A red e2e job is now a real regression.
#     * chaos-tests: opt-in (schedule/manual), never blocks.
#   secret-detection stage — GitLab Secret Detection (unchanged).
#
# All Python steps run through uv against the committed uv.lock (UV_FROZEN),
# on the project's pinned Python 3.14. Notes:
#   * valkey[libvalkey] is a C extension with no cp314 wheel yet → compiled
#     from source, so every uv job installs build-essential first (the slim uv
#     image ships no compiler).
#   * The `reload` extra (watchfiles) is needed by the hot-reload tests; it
#     ships abi3 wheels so it installs without a Rust toolchain. `fast`
#     (orjson) is intentionally NOT installed — it has no cp314/abi3 wheel and
#     would require Rust; no test hard-depends on it.
# Run exactly one pipeline per push: a branch (or tag) pipeline. Merge-request
# pipelines are suppressed because the test jobs carry no MR `rules` and would
# be skipped there — which is what produced the confusing "skipped" MR pipeline
# alongside the real branch pipeline. The MR shows the branch pipeline's status.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_FROZEN: "1"
  # Canonical uv invocation: test deps + the reload extra the hot-reload
  # tests need. Keep every test job using this so the resolved env matches.
  UV_RUN: "uv run --extra test --extra reload"

# Shared uv setup: pinned-Python image, build toolchain for the libvalkey C
# extension, and a lockfile-keyed dependency cache.
.uv:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential

# Real RabbitMQ + Valkey services + a readiness gate. Reused by the
# integration and e2e jobs. (rabbitmq gets the alias `rabbitmq` automatically
# from its image name; only valkey/valkey:8 needs an explicit `valkey` alias.)
.with-services:
  extends: .uv
  services:
    - name: rabbitmq:4-management
    - name: valkey/valkey:8
      alias: valkey
  variables:
    SWARMQ_TEST_RABBITMQ_HOST: rabbitmq
    SWARMQ_TEST_RABBITMQ_PORT: "5672"
    SWARMQ_TEST_VALKEY_HOST: valkey
    SWARMQ_TEST_VALKEY_PORT: "6379"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential
    # Block until both services accept connections. check_docker SKIPS (not
    # fails) when a service is unreachable, so without this gate a slow broker
    # start would let the whole suite go green with zero tests run. This also
    # warms the uv venv (build + extras) once before the test step.
    - |
      $UV_RUN python - <<'PY'
      import socket, sys, time
      targets = [("rabbitmq", 5672), ("valkey", 6379)]
      deadline = time.time() + 120
      for host, port in targets:
          while True:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      break
              except OSError:
                  if time.time() > deadline:
                      sys.exit(f"service {host}:{port} not ready in time")
                  time.sleep(1)
      print("all services ready")
      PY

# Lint + Typen (Plan U2): erstes blockierendes Gate für ruff und mypy — bis
# dahin existierten beide nur in den toten GitHub-Workflows. mypy-Umfang
# wächst in U4 um tests/support und tests/contracts (KTD1-Konformitätsanker).
# Kein Build-Toolchain nötig (ruff/mypy brauchen die C-Extension nicht);
# $UV_RUN, damit mypy das `reload`-Extra (watchfiles) auflösen kann.
lint-and-types:
  extends: .uv
  stage: test
  before_script: []
  script:
    - $UV_RUN ruff check src/ tests/
    - $UV_RUN mypy src/swarmq tests/support tests/contracts

# Tier 1 — unit + property. No external services; the fast regression gate.
# Guards against uv.lock drifting from pyproject.toml — including optional
# extras that no other job installs. UV_FROZEN cannot catch that drift: it only
# fails an install that re-resolves against the missing piece, and an
# un-installed extra is never resolved. Must override UV_FROZEN to 0 here —
# under UV_FROZEN=1, `uv lock --check` validates only lock *validity*, not
# up-to-dateness (it warns and exits 0 even with drift). No build toolchain
# needed, so before_script is emptied. See
# docs/solutions/tooling-decisions/uv-lock-drift-from-pyproject-optional-extras.md
lock-check:
  extends: .uv
  stage: test
  variables:
    UV_FROZEN: "0"
  before_script: []
  script:
    - uv lock --check

# --reruns 1 absorbs the rare timing flake on the small shared runner without
# hiding deterministic failures (a real break fails both attempts).
# Härtung R2 B1: the pure parser-fuzz suite joins the blocking gate — it is
# deterministic (seeded corpus), service-free and sub-second; previously NO
# CI job ever executed tests/fuzz, so the suite was rotting unnoticed.
unit-tests:
  extends: .uv
  stage: test
  script:
    - $UV_RUN pytest tests/unit -q --reruns 1 --reruns-delay 1
    - $UV_RUN pytest tests/property -m property -q
    - $UV_RUN pytest tests/fuzz/test_parser_fuzz.py -m fuzz -q

# Tier 2a — integration against real RabbitMQ + Valkey (deterministic).
integration-tests:
  extends: .with-services
  stage: test
  script:
    - $UV_RUN pytest tests/integration -q

# Tier 2b — full e2e. BLOCKING, no reruns. The two confirmed flakiness causes
# (cron-sync clobber; orphaned scheduler tasks on cancel) are fixed and the
# full suite ran clean 3x under 6-way CPU saturation, so the gate is honest.
e2e-tests:
  extends: .with-services
  stage: test
  script:
    - $UV_RUN pytest tests/e2e -q

# Tier 2c — stress against real services. Härtung R2 B1: previously never
# executed by any CI job. Scheduled (nightly) + manual; honest gate on the
# scheduled run (no allow_failure) so a stress regression actually notifies.
stress-tests:
  extends: .with-services
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  script:
    - $UV_RUN pytest tests/stress -m stress -q

# Tier 3b — soak (1h sustained load). Deliberately manual-only: too long for
# every schedule; run before releases. Documented here so the exclusion is
# explicit, not silent (Härtung R2 B1).
soak-tests:
  extends: .with-services
  stage: test
  rules:
    - when: manual
      allow_failure: true
  allow_failure: true
  script:
    - $UV_RUN pytest tests/soak -m soak -q

# Tier 3 — chaos (Toxiproxy + docker compose). Runs on scheduled pipelines,
# on manual trigger, and — blocking-manual — on feature branches that touch
# pipeline/broker/backend/contracts paths (KTD15, see rules below). Needs a
# Docker-in-Docker capable runner.
# Härtung R2 B1: runs the WHOLE chaos directory (previously only 1 of 5
# files) plus the chaos-stack-backed external-publish fuzz suite.
chaos-tests:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  stage: test
  services:
    # Kein `alias: docker` mehr: den vergibt der Runner inzwischen selbst aus
    # dem Image-Namen, und die doppelte Angabe wurde mit
    # "Skipping alias docker ... already in use by another service" verworfen.
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    # Ohne das ueberspringt sich dieses Gate selbst, sobald der Dienst nicht
    # kommt -- und meldet trotzdem Erfolg. Beide Laeufe, die es je gab
    # (2026-09-15 und 2026-09-22), endeten so: "1 passed, 40 skipped",
    # 1,17 s, gruen. Mit dieser Variable wird ein fehlender Stack ein
    # Fehlschlag (tests/chaos/conftest.py).
    SWARMQ_REQUIRE_CHAOS: "1"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_FROZEN: "1"
    UV_RUN: "uv run --extra test --extra reload"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Plan U2 / KTD15 — Chaos-Gate als CI-Regel: Feature-Branches, die die
    # Worker-Pipeline, Broker-, Backend- oder Contracts-Pfade berühren,
    # bekommen den Job als manuellen, NICHT überspringbaren Schritt; die
    # Branch-Pipeline bleibt "blocked", bis er grün gelaufen ist. (MR-Pipelines
    # sind per `workflow: rules` unterdrückt, eine MR-Regel griffe nie.)
    # `allow_failure: true` auf Job-Ebene entfällt, sonst überstimmt es die Regel.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - src/swarmq/worker.py
          - src/swarmq/worker/**
          - src/swarmq/broker/**
          - src/swarmq/backend/**
          - src/swarmq/contracts/**
        compare_to: refs/heads/main
      when: manual
      # `allow_failure: false` haelt die Branch-Pipeline blockiert, bis der
      # Job gruen gelaufen ist. Der frueher hier genannte Validierungslauf
      # (Pipeline 2795414492) hat nie stattgefunden -- sein Job stand auf
      # `manual` und wurde nie gestartet.
      allow_failure: false
    - when: manual
      allow_failure: true
  before_script:
    # build-essential: libvalkey C extension (the `reload` extra).
    # docker CLI + compose v2 plugin: NOT in Debian's repos
    # (`docker-compose-v2` does not exist there) — pull them from Docker's
    # official apt repo so `docker compose` is the v2 subcommand the chaos
    # fixture shells out to.
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential ca-certificates curl
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update
    - apt-get install -y --no-install-recommends docker-ce-cli docker-compose-plugin
    - docker compose version
  script:
    - $UV_RUN pytest -m chaos tests/chaos -q
    - $UV_RUN pytest -m fuzz tests/fuzz/test_external_publish_fuzz.py -q

secret_detection:
  stage: secret-detection

include:
- template: Security/Secret-Detection.gitlab-ci.yml
