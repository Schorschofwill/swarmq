name: Feature request
description: Suggest a new capability or a change to existing behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SwarmQ keeps a deliberately small core, and many design choices are settled on purpose.
        Please check the [design decisions](https://swarmq.readthedocs.io/en/latest/explanation/design-decisions/)
        before proposing a change to one of them.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the API or behaviour could look. Code sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you have tried or considered, including doing it in your own code or middleware.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you implement it?
      options:
        - "Yes, with guidance"
        - "Maybe"
        - "No"
