# OpenSSF Scorecard (Teil 3 der Professionalisierung, 2026-10-29).
#
# Bewertet Lieferkette und Repo-Einstellungen (gepinnte Actions,
# Token-Rechte, Branch-Schutz, …). Die Ergebnisse gehen als SARIF in die
# Code-Scanning-Ansicht und, mit publish_results, an api.scorecard.dev für das
# Badge in der README. Läuft auf einem Runner von GitHub, nicht auf celsius.
# Die Action verlangt: keine Schreibrechte auf Workflow-Ebene, id-token nur in
# diesem Job und dort nur die von ihr erlaubten Actions.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
