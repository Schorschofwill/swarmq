# CodeQL (statische Sicherheitsanalyse, Scorecard SAST; 2026-10-29).
#
# Prüft den Python-Code bei jedem Push und PR auf main sowie wöchentlich mit
# aktualisierten Abfragen. Läuft auf einem Runner von GitHub, nicht auf
# celsius: Die Analyse braucht keine Dienste, und Fork-PRs laufen so ohne
# Freigabe. Funde erscheinen unter Security → Code scanning.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:python
