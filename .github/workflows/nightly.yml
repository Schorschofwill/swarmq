name: Nightly (chaos + stress + fuzz)

# U4.3 — nightly schedule. Goal ≤ 30 min. Runs the opt-in suites that
# are too slow / flaky for pre-merge.

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write  # for flaky-quarantine bot in U4.4

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --extra test
      - name: Chaos tests (toxiproxy + per-class compose stack)
        run: uv run --extra test pytest tests/chaos -v --tb=short -m chaos --reruns 2 --reruns-delay 5
        env:
          # Disk-pressure tests are explicitly opt-in even in nightly.
          SWARMQ_RUN_DISK_TESTS: "0"

  combinations-chaos:
    # E2E feature-combinations Tier-2/3 tests (@pytest.mark.chaos under
    # tests/e2e/combinations/). Uses the docker-compose.chaos.yml stack
    # because tests need Toxiproxy alongside the rabbitmq + valkey
    # services — service-block setup doesn't carry depends_on health
    # gating cleanly. See plan 2026-05-26-002 Unit 8.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --extra test
      - name: Start chaos stack (rabbitmq + valkey + toxiproxy)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d
          # Poll until Toxiproxy admin API responds — readiness gate.
          for i in {1..30}; do
            if curl -sf http://localhost:8474/proxies > /dev/null; then
              echo "Toxiproxy ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Combinations chaos tests
        env:
          SWARMQ_TEST_RABBITMQ_HOST: "localhost"
          SWARMQ_TEST_RABBITMQ_PORT: "5672"
          SWARMQ_TEST_VALKEY_HOST: "localhost"
          SWARMQ_TEST_VALKEY_PORT: "6379"
          SWARMQ_TEST_TOXIPROXY_HOST: "localhost"
          SWARMQ_TEST_TOXIPROXY_PORT: "8474"
          # Toxiproxy talks to upstream services via the compose
          # network's internal DNS.
          SWARMQ_TEST_TOXIPROXY_RMQ_UPSTREAM: "rabbitmq:5672"
          SWARMQ_TEST_TOXIPROXY_VALKEY_UPSTREAM: "valkey:6379"
        run: uv run --extra test pytest tests/e2e/combinations -v --tb=short -m chaos --reruns 2 --reruns-delay 5
      - name: Stop chaos stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml down -v

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5673:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 5s --health-retries 10
    env:
      SWARMQ_TEST_RABBITMQ_PORT: "5673"
      SWARMQ_TEST_VALKEY_PORT: "6380"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --extra test
      - run: uv run --extra test pytest tests/stress -v --tb=short -m stress

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5673:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 5s --health-retries 10
    env:
      SWARMQ_TEST_RABBITMQ_PORT: "5673"
      SWARMQ_TEST_VALKEY_PORT: "6380"
      HYPOTHESIS_PROFILE: thorough
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --extra test
      - run: uv run --extra test pytest tests/fuzz tests/property -v --tb=short -m "fuzz or property"

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --extra test
      - run: uv tool install bandit
      - name: Bandit (high-severity gate)
        run: uvx bandit -r src/ -ll
