# Abhängigkeits-Updates (Teil 3 der Professionalisierung, 2026-10-29).
#
# Sicherheitsupdates öffnet Dependabot unabhängig von diesem Plan, sobald eine
# Warnung vorliegt. Die regelmäßigen Updates sind gebündelt, damit nicht jede
# Version einen eigenen PR (und einen CI-Lauf auf celsius) erzeugt. Die
# Wartezeit (cooldown) lässt frisch veröffentlichte Versionen erst eine Woche
# liegen: Kompromittierte Releases fallen meist in den ersten Tagen auf.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # aiormq und aio-pika sind in pyproject.toml beim nächsten Minor
    # begrenzt; Anhebungen darüber schlägt Dependabot vor, die Tests
    # entscheiden (docs/plans/2026-10-29-1945-chore-aiormq-7-2-anheben-
    # plan.md, KTD8).
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Basis-Images der Dockerfiles, per Digest gepinnt (Scorecard
  # Pinned-Dependencies). Monatlich genügt: beide Abbilder laufen nur für
  # Messungen und Mutation-Testing, nicht in der CI.
  - package-ecosystem: docker
    directories:
      - /benchmarks/comparison
      - /docker/mutation
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"
